server {
    listen 80;
    server_name 138.197.86.69;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # React static files
    root /var/www/stats-ai;
    index index.html;

    # React Router — all non-file, non-API requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI backend — proxy /api/* to backend container
    # Use variable + resolver to force runtime DNS resolution
    # (avoids "host not found" if backend container isn't up yet at nginx start)
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://backend:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
