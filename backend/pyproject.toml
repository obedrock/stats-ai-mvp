[project]
name = "stats-ai-backend"
version = "0.1.0"
description = "Stats-AI backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.135.2",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.18.4",
    "celery[redis]>=5.6.2",
    "redis[hiredis]>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "bcrypt<5",
    "gunicorn>=22.0.0",
    "fredapi==0.5.2",
    "yfinance==1.2.0",
    "pandas>=3.0.1",
    "anthropic>=0.86.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.34.1",
    "openpyxl>=3.1.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
